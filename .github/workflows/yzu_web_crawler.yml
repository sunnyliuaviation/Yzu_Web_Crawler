name: Web Crawler and Email

# 設定工作流程排程
on:
  schedule:
    # 使用 cron 表達式設定每天早上 7 點運行 (UTC 時間，所以使用 23:00)
    - cron: '0 23 * * *'  # UTC 時間為 23:00，相當於台灣時間的 07:00
  workflow_dispatch: #允許在 Github 上手動執行

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # 指定 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        env:
          # 設定環境變數，這些值來自 GitHub Secrets
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python yzu_web_crawler.py  
